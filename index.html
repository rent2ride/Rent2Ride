<!DOCTYPE html>
<html lang="fr" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rent2Ride — Bientôt disponible</title>
<meta name="description" content="Rent2Ride, location de motos sur la Costa del Sol. Le site arrive très bientôt.">
<meta name="robots" content="noindex">
<meta name="google-site-verification" content="KeyfB45eFGhDhpVowBp1KE3Sq1OamEByYlI-zUFpJso" />
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/base.css">
<link rel="stylesheet" href="./css/components.css?v=2">
<style>
  .soon-page{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:40px 24px;
    background:var(--c-dark); color:#fff;
  }
  .soon-logo{ max-width:280px; width:100%; height:auto; filter:brightness(0) invert(1); margin-bottom:32px; }
  .soon-eyebrow{
    font-size:.8rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
    color:var(--c-accent); margin:0 0 14px;
  }
  .soon-title{ font-family:var(--f-display); font-size:clamp(1.8rem,4.5vw,2.8rem); margin:0 0 16px; font-weight:600; }
  .soon-text{ color:rgba(255,255,255,.75); max-width:480px; margin:0 0 36px; line-height:1.6; }
  .soon-actions{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
</style>
</head>
<body>

<div class="soon-page">
  <div class="lang-switch" style="margin-bottom:20px;" id="soonLangSwitch">
    <button data-lang="fr" class="active">FR</button>
    <button data-lang="es">ES</button>
    <button data-lang="en">EN</button>
  </div>
  <img src="./images/logo-signature.png" alt="Rent2Ride" class="soon-logo">
  <p class="soon-eyebrow" data-i18n="soon_eyebrow">Bientôt disponible</p>
  <h1 class="soon-title" data-i18n="soon_title">Le site arrive très prochainement</h1>
  <p class="soon-text" data-i18n="soon_text">Nous préparons votre expérience de location de motos sur la Costa del Sol. Une question en attendant ? Contactez-nous directement.</p>
  <p class="soon-text" style="margin-top:-20px; display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap;">
    <span data-i18n="soon_momoven_text">En attendant, vous pouvez déjà louer notre moto sur</span>
    <a href="https://www.momoven.es/cuenta-motos" id="momovenLink" target="_blank" rel="noopener" style="display:inline-flex; align-items:center; background:#fff; padding:6px 12px; border-radius:6px;">
      <img src="./images/logo-momoven.svg" alt="Momoven" style="height:20px; width:auto; vertical-align:middle;">
    </a>
  </p>
  <div class="soon-actions">
    <a href="https://wa.me/33688133895" target="_blank" rel="noopener" class="btn btn-primary" style="display:inline-flex; align-items:center; gap:8px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#25D366" aria-hidden="true">
        <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.44.79 3.07 1.2 4.74 1.2h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.86 9.86 0 0 0 12.04 2zm5.8 14.06c-.24.68-1.4 1.3-1.93 1.38-.5.08-1.12.11-1.81-.11-.42-.13-.95-.31-1.64-.6-2.89-1.25-4.78-4.16-4.92-4.35-.14-.19-1.18-1.57-1.18-3 0-1.43.75-2.13 1.02-2.42.27-.29.58-.36.78-.36.19 0 .39 0 .56.01.18.01.42-.07.66.5.24.58.83 1.99.9 2.14.07.14.11.31.02.5-.09.19-.14.31-.28.48-.14.17-.29.37-.42.5-.14.14-.28.28-.12.55.16.28.72 1.19 1.55 1.93 1.06.95 1.96 1.24 2.24 1.38.28.14.44.12.6-.07.17-.19.71-.83.9-1.11.19-.28.38-.24.63-.14.26.09 1.65.78 1.94.93.28.14.47.21.54.33.07.12.07.7-.17 1.38z"/>
      </svg>
      <span data-i18n="soon_whatsapp_btn">Nous écrire sur WhatsApp</span>
    </a>
  </div>
</div>

<script>
  /* =========================================================
     TRADUCTION FR / ES / EN — page "Bientôt disponible"
     ---------------------------------------------------------
     Page autonome (pas de i18n.js chargé ici). Utilise la même
     clé de stockage "cds_lang" que le reste du site : si le
     visiteur a déjà choisi une langue ailleurs, elle est reprise
     automatiquement ici, et inversement.
     ========================================================= */
  const SOON_TRANSLATIONS = {
    title: {
      fr: "Rent2Ride — Bientôt disponible",
      es: "Rent2Ride — Próximamente",
      en: "Rent2Ride — Coming soon"
    },
    description: {
      fr: "Rent2Ride, location de motos sur la Costa del Sol. Le site arrive très bientôt.",
      es: "Rent2Ride, alquiler de motos en la Costa del Sol. El sitio llega muy pronto.",
      en: "Rent2Ride, motorcycle rental on the Costa del Sol. The site is launching very soon."
    },
    soon_eyebrow: {
      fr: "Bientôt disponible",
      es: "Próximamente",
      en: "Coming soon"
    },
    soon_title: {
      fr: "Le site arrive très prochainement",
      es: "El sitio llega muy pronto",
      en: "The site is launching very soon"
    },
    soon_text: {
      fr: "Nous préparons votre expérience de location de motos sur la Costa del Sol. Une question en attendant ? Contactez-nous directement.",
      es: "Estamos preparando su experiencia de alquiler de motos en la Costa del Sol. ¿Alguna pregunta mientras tanto? Contáctenos directamente.",
      en: "We're preparing your motorcycle rental experience on the Costa del Sol. Got a question in the meantime? Contact us directly."
    },
    soon_momoven_text: {
      fr: "En attendant, vous pouvez déjà louer notre moto sur",
      es: "Mientras tanto, ya puede alquilar nuestra moto en",
      en: "In the meantime, you can already rent our bike on"
    },
    soon_whatsapp_btn: {
      fr: "Nous écrire sur WhatsApp",
      es: "Escríbenos por WhatsApp",
      en: "Message us on WhatsApp"
    }
  };

  const SOON_LANGS = ["fr", "es", "en"];
  const SOON_STORAGE_KEY = "cds_lang";

  function getSoonLang(){
    const stored = localStorage.getItem(SOON_STORAGE_KEY);
    if (stored && SOON_LANGS.includes(stored)) return stored;
    const nav = (navigator.language || "fr").slice(0,2);
    return SOON_LANGS.includes(nav) ? nav : "fr";
  }

  function applySoonLang(lang){
    document.getElementById("htmlRoot").lang = lang;
    document.title = SOON_TRANSLATIONS.title[lang];
    document.querySelector('meta[name="description"]').setAttribute("content", SOON_TRANSLATIONS.description[lang]);
    document.querySelectorAll("[data-i18n]").forEach(el => {
      const key = el.getAttribute("data-i18n");
      if (SOON_TRANSLATIONS[key]) el.textContent = SOON_TRANSLATIONS[key][lang];
    });
    document.querySelectorAll("#soonLangSwitch button").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.lang === lang);
    });
    localStorage.setItem(SOON_STORAGE_KEY, lang);
  }

  document.querySelectorAll("#soonLangSwitch button").forEach(btn => {
    btn.addEventListener("click", () => applySoonLang(btn.dataset.lang));
  });

  applySoonLang(getSoonLang());
</script>

</body>
</html>
